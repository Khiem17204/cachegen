[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cachegen"
version = "0.1.0"
description = "CacheGen: KV Cache Compression and Streaming for Fast LLM Serving"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "zstandard>=0.20",
    "transformers>=4.0",
]

[project.optional-dependencies]
benchmarks = [
    "matplotlib>=3.0",
    "pandas>=1.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["encoder*", "decoder*", "kv_extraction_hf*", "vllm_integration*"]
